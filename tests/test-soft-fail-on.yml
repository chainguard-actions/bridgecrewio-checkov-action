name: Test soft_fail_on with skip options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/insecure
          check: CKV_AWS_24
          soft_fail_on: CKV_AWS_24
          skip_framework: secrets
          skip_path: tests/fixtures/secure
          skip_cve_package: CVE-2018-19788
          skip_download: true
          skip_results_upload: true
          download_external_modules: false
          enable_secrets_scan_all_files: false
          log_level: INFO
          output_format: cli
      - name: Assert action succeeded because failing check is soft-fail
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success because CKV_AWS_24 is listed in soft_fail_on"
            exit 1
          fi
          echo "PASS"
