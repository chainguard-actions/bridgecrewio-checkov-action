name: Test platform options with API key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # These options require a real Bridgecrew/Prisma platform account, which the
      # harness cannot provide. The action must run and either succeed or fail
      # gracefully; it must not be skipped.
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 10
        with:
          directory: tests/fixtures/insecure
          framework: terraform
          api-key: invalid-api-key
          prisma-api-url: https://api.prismacloud.io
          use_enforcement_rules: true
          output_bc_ids: true
          policy_metadata_filter: policy.label=test
          policy_metadata_filter_exception: cloud.type=gcp
          external_checks_repos: github.com/bridgecrewio/checkov//tests/terraform/runner/extra_yaml_checks
          docker_image: alpine:3.19
          dockerfile_path: tests/fixtures/Dockerfile
          output_format: cli
      - name: Assert action ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
