name: Test framework and download_external_modules inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: ./actions/hardened/bridgecrewio--checkov-action/v12.1347.0/tests/fixtures/terraform
          framework: terraform
          download_external_modules: "false"
          soft_fail: "true"
          output_format: cli
          log_level: WARNING
      - name: Assert action completed
        run: |
          echo "PASS: action completed with framework and download_external_modules inputs"
