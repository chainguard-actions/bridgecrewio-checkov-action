name: Test Checkov scan with skipped checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          directory: tests/fixtures/terraform
          # Skip S3 and security group checks
          skip_check: "CKV_AWS_18,CKV_AWS_24,CKV_AWS_25"
          soft_fail: "true"
          output_format: cli
          log_level: WARNING

      - name: Assert action completed with skipped checks
        run: |
          echo "PASS: action completed with skip_check filter applied"
