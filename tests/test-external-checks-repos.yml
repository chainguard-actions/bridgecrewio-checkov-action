name: Test Checkov scan with external checks repos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          directory: tests/fixtures/terraform
          # Use a known public checkov custom checks repo
          external_checks_repos: bridgecrewio/checkov-action
          soft_fail: "true"
          output_format: cli
          log_level: WARNING
        continue-on-error: true

      - name: Assert action ran with external_checks_repos input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The repo may or may not be a valid checks repo; either outcome is acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with external_checks_repos input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
