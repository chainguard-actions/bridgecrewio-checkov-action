name: Test basic soft_fail and quiet
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: ./actions/hardened/bridgecrewio--checkov-action/v12.1347.0/tests/fixtures/terraform
          soft_fail: "true"
          quiet: "true"
          output_format: cli
          log_level: WARNING
      - name: Assert results output exists
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          echo "PASS: action completed with soft_fail and quiet"
