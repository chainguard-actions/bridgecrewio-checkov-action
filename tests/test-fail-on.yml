name: Test hard_fail_on and soft_fail_on inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: ./actions/hardened/bridgecrewio--checkov-action/v12.1347.0/tests/fixtures/terraform
          soft_fail: "true"
          soft_fail_on: "CKV_AWS_18"
          hard_fail_on: "CKV_AWS_999"
          output_format: cli
          log_level: WARNING
      - name: Assert action completed
        run: |
          echo "PASS: action completed with hard_fail_on and soft_fail_on inputs"
