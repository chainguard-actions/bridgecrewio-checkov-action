name: Test hard fail on failed check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          directory: tests/fixtures/insecure
          check: CKV_AWS_24
          framework: terraform
          output_format: cli
      - name: Assert action failed due to failed check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because CKV_AWS_24 fails on the insecure fixture"
            exit 1
          fi
          echo "PASS"
