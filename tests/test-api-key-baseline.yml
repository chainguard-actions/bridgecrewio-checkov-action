name: Test api-key and baseline inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MY_BC_API_KEY: "dummy-api-key-for-testing"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          directory: ./actions/hardened/bridgecrewio--checkov-action/v12.1347.0/tests/fixtures/terraform
          api-key: MY_BC_API_KEY
          baseline: ./actions/hardened/bridgecrewio--checkov-action/v12.1347.0/tests/fixtures/baseline/.checkov.baseline
          soft_fail: "true"
          output_format: cli
          log_level: WARNING
      - name: Assert action completed
        run: |
          echo "PASS: action completed with api-key and baseline inputs"
