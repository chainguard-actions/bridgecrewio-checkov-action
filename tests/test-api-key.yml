name: Test Checkov scan with api-key input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          directory: tests/fixtures/terraform
          # api-key is the name of the env var containing the Bridgecrew API key.
          # We pass a dummy env var name; without a real key the action still runs
          # but won't upload results to the Bridgecrew platform.
          api-key: BC_API_KEY_TEST
          soft_fail: "true"
          output_format: cli
          log_level: WARNING
        continue-on-error: true

      - name: Assert action ran with api-key input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without a real Bridgecrew API key the action may fail on upload,
          # but it should still run the scan. Either outcome is acceptable.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with api-key input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
