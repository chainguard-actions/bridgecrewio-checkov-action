name: Test single file scan with hard_fail_on
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          file: tests/fixtures/insecure/main.tf
          check: CKV_AWS_24
          framework: terraform
          compact: true
          quiet: true
          hard_fail_on: CKV_AWS_24
          output_format: cli
      - name: Assert action failed due to hard_fail_on check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because CKV_AWS_24 is a hard-fail check and fails"
            exit 1
          fi
          echo "PASS"
